const u=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function dec(key){
  const buf=await crypto.subtle.decrypt({name:"AES-GCM",iv:u(P.n)},key,u(P.d));
  return new Response(new Blob([buf]).stream().pipeThrough(new DecompressionStream("gzip"))).text();
}
function show(html){document.open();document.write(html);document.close()}
async function derive(pw){
  const b=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);
  return crypto.subtle.deriveKey({name:"PBKDF2",salt:u(P.s),iterations:P.i,hash:"SHA-256"},b,{name:"AES-GCM",length:256},true,["decrypt"]);
}
(async()=>{let k=null;try{k=localStorage.getItem("opsdesk.k")}catch(e){}
  if(k){try{const key=await crypto.subtle.importKey("raw",u(k),"AES-GCM",false,["decrypt"]);show(await dec(key));return}catch(e){try{localStorage.removeItem("opsdesk.k")}catch(_){}}}
})();
document.getElementById("f").onsubmit=async ev=>{ev.preventDefault();
  const b=document.getElementById("b"),e=document.getElementById("e");b.disabled=true;e.textContent="";
  const rem=document.getElementById("r").checked;
  try{const key=await derive(document.getElementById("p").value);
    const html=await dec(key);
    if(rem){try{const raw=new Uint8Array(await crypto.subtle.exportKey("raw",key));localStorage.setItem("opsdesk.k",btoa(String.fromCharCode(...raw)))}catch(_){}}
    show(html);
  }catch(err){e.textContent="密码不对 / Wrong password";b.disabled=false}
};
